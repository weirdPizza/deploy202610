<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUESTBOOK</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        nav ul a:first-child{
            z-index: 1;
        }
        nav ul a:nth-child(2){
            z-index: 10;
        }
        nav ul a:last-child{
            z-index: 100;
        }
        #page {
            padding: 30px;
            background-color: #DBEDF1;
        }  
        
        #main {
            width: 100%;
            min-height : 800px;
            margin: 10px 0;
        }
        #main #guestContainer{
            width: 100%;
            border: 1px solid #333;
            background-color: #eee;
            font-size: 20px;
            font-weight: 300;
            height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;

        }
        .guestBox{
            border: 1px solid #333;
            margin: 24px;
        }
        .guestTitle{
            border-bottom: 1px solid #333;
            line-height: 40px;
            background-color: lemonchiffon;
            padding: 0 10px;
        }
        .guestTitle > div {
            float:left;
        }
        .guestTitle::after{
            content: "";
            display: block;
            clear: both;
        }
        .guestTitle div:first-child{
            width: 97%;
        }
        .guestTitle div span {
            margin-right: 4px;
        }
        .guestTitle .guestName {
            font-weight: 400;
        }
        .guestTitle .guestDel {
            width: 3%;
            font-size: 28px;
        }
        .guestTitle .guestDate{
            color : #555;
            font-size: 12px;
        }
        .guestContent {
            background-color: white;
            padding: 12px;
            white-space: pre-line
        }

        /* GUEST INPUT */
        section:last-child{
            width: 100%;
            height: auto;
            margin-top: 46px;
        }
        label{
            width: 100%;
            display: inline-block;
        }
        label:first-child{
            height: 52px;
        }
        label:last-child{
            margin-top: -1px;
            height: 120px;
        }
        label div, textarea {
            float: left;
        }
        label::after{
            content: "";
            clear: both;
            display: block;
        }
        label div {
            width: 16%;
            background-color: #E3F6D9;
            text-align: center;
            line-height: 52px;
            height: 100%;
            border:1px solid #333;
            border-right: none;
            font-size: 20px;
        }
        label:last-child div{
            line-height: 120px;
        }
        input[type="text"], textarea{
            width: 84%;
            height: 100%;
            padding: 10px;
            font-size: 16px;
            resize: none;
        }
        section:last-child > div:last-child{
            text-align: right;
            margin-top: 10px;
        }
        input[type="submit"] {
            width: 112px;
            height: 60px;
            background: #DBEDF1 url(./registerBtn.png) center / contain;
            border: none;
            padding-bottom: 12px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;            
        }


    </style>
</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->

        <div id="container">
            <nav>
                <ul>
                    <a href="./page1.html">
                        <li>FOMAL</li>
                        <img src="Star border.png" alt="별모양 사진">
                    </a>
                    <!-- <li>
                        <a href="./page1.html">FOMAL</a>
                        <button class="starBtn btn" onclick="fnToggleStar()">별</button>
                    </li> -->
                    <a href="./page2.html">
                        <li>CASUAL</li>
                        <img src="Star border.png" alt="별모양 사진">
                    </a>
                    <!-- <li><a href="./page2.html">CASUAL</a></li> -->
                    <a href="./page3.html">
                        <li>GUESTBOOK</li>
                        <img src="Star rate.png" alt="현재 페이지 표시, 별모양 사진">
                    </a>
                    <!-- <li><a href="./page3.html">GUESTBOOK</a></li> -->
                </ul>
            </nav>
            <div id="page">
                    <!-- 여기 안에 aside랑 main 넣어야 border가 이쁘게 나올 거 같음 -->
                <h1>GUESTBOOK</h1>
                <div id="main">
                    
                    <!-- GUESTBOOK CONTENTS -->
                    <section id="guestContainer">

                        <div class="guestBox" v-for="item in list">
                            <div class="guestTitle">
                                <div>
                                    <span class="guestNo">#{{item.NUM}}</span>
                                    <span class="guestName">{{item.NAME}}</span>
                                    <span class="guestDate">{{item.DATE}}</span>
                                </div>
                                <div class="guestDel" @click="fnGuestDel(item.NUM)"><a href="javascript:;">☒</a></div>
                            </div>
                            <div class="guestContent">
                                {{item.CONTENT}}
                            </div>
                        </div>
                    </section>

                    <!-- GUESTBOOK INPUT -->
                    <section>
                        <div>
                            <label>
                                <div>이름</div>
                                <input class="inputName" type="text" autofocus v-model="inputName">
                            </label>
                            <label>
                                <div>내용</div>
                                <textarea class="inputContent" v-model="inputContent" @keyup.enter="fnRegister"></textarea>
                            </label>
                        </div>
                        <!-- 굳이 div로 안묶어도 되지 않을까? css 적용하고 생각하기 -->
                        <div>
                            <input type="submit" value="등록" @click="fnRegister">
                        </div>
                        
                    </section>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
<script>
    const app = Vue.createApp({ // createApp함수는 인자로 맵을 받음
        data() {
            return {
                // 변수 - (key : value) <맵형태
                list:[
                    {
                        NUM:3,
                        NAME:"김나리",
                        DATE: "2024/12/28",
                        CONTENT:"이 편지는 영국에서 최초로 시작되어 일년에 한바퀴를 돌면 서 받는 사람에게 행운을 주었고"+
                                "지금은 당신에게로 옮겨진 이 편지는 4일 안에 당신 곁을 떠나야 합니다. 이 편지를 포함해서"+
                                "7통을 행운이 필요한 사람에게 보내 주셔야 합니다. 복사를 해도 좋습니다. 혹 미신이라 하실지"+
                                "모르지만 사실입니다."
                    },
                    {
                        NUM:2,
                        NAME:"좋은하루보내세요",
                        DATE:"2024/12/25",
                        CONTENT:"잘 들렸다 갑니다."
                    },
                    {
                        NUM:1,
                        NAME: "별이맘",
                        DATE: "2024/12/24",
                        CONTENT:  "안녕하세요. 좋은 정보 감사합니다 ^^.\n"+
                                "제 블로그에 놀러오세요~\n"+
                                "blog.com/atvet1234567\n"+
                                "@->----"
                    }
                ],
                inputName : "",
                inputContent: ""
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnTest: function () {
                let self = this;
                $.ajax({
                    url: "",
                    dataType: "json",
                    type: "GET",
                    data: {},
                    success: function (data) {

                    }
                });
            },
            fnRegister: function(){
                let self = this;
                // 이름이 20글자 이내여야 함, 이름 공백안됨, 내용 공백안됨 
                if(self.inputName.length<=20 && self.inputName !="" && self.inputContent!=""){
                    let datetime = new Date();
                    let year = datetime.getFullYear();
                    let month = datetime.getMonth()+1 < 10 ? "0" + datetime.getMonth()+1 : datetime.getMonth()+1;
                    let date = datetime.getDate() < 10 ? "0" + datetime.getDate() : datetime.getDate();
                    let fullDate = year + "/" + month + "/" + date;
                    
                    self.list.unshift({NUM:self.list.length+1, NAME: self.inputName, DATE: fullDate, CONTENT:self.inputContent});

                    alert("등록되었습니다.");

                    //초기화
                    self.inputName="";
                    self.inputContent="";
                    return;
                }
                if(self.inputName.length>20){
                    alert("이름은 20글자 이내여야 합니다.");
                    return;
                }
                if(self.inputName==""){
                    alert("이름을 1글자 이상 입력해주세요.");
                    return;
                }
                if(self.inputContent==""){
                    alert("내용을 1글자 이상 입력해주세요.");
                }

            },

            fnGuestDel: function(num){
                let self = this;
                if(!confirm("정말 삭제하시겠습니까?")){
                    return;
                }
                for(let i=0; i<self.list.length; i++){
                    if(self.list[i].NUM == num){
                        self.list.splice(i,1);
                    }
                }
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');

</script>
