<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASUAL</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        nav ul a:first-child{
            z-index: 1;
        }
        nav ul a:nth-child(2){
            z-index: 100;
        }
        nav ul a:last-child{
            z-index: 1;
        }
        #page {
            padding: 30px;
            background-color: #FDEAC5;

        }  
        
        #main{
            background-color: white;
            height: auto;
            margin: 10px;
        }
        
        table {
            width: 100%;
        }
        table, tr, th, td:not(img){
            border: 1px solid #333;
            border-collapse: collapse;
            padding : 32px 20px;
            font-size: 20px;
            font-weight: 300;
            text-align: center;
        }
        
        th{
            font-weight: 400;
        }

        #personality {
            padding: 20px 28px;
            background-image: url(quoteBg.png);
            background-size: 100%;
            background-position: center;
        }
        .personalityStyle{
            width: 570px;
            background-color: lemonchiffon;
        }
        .personalityStyle2 {
            width: 80px; 
            background-color: #E3F6D9;
        }

        #favorite{
            padding: 0px;
            background-size: cover;
            background-position: center;
        }
        .favoriteStyle{
            background-color:#DBEDF1;
            width: 280px; 
        }
        .fMenu span{
            font-weight: 600;
        }
        .fMenu:hover {
            background-color: #FDEAC5;
            cursor: pointer;
        }

        /* 서로 다른 tr에 있음. 형제 선택자 ~가 있긴 하지만 */
        /* favorite이 drama, movie menu보다 먼저 나오므로  */
        /* ~로 선택 못함. 따라서 has()를 이용하면 가능 */
        table:has(#mangaMenu:hover) #favorite {
            background-image: url("./hunter.png");
            text-indent: -9999px;
        }

        table:has(#dramaMenu:hover) #favorite {
            background-image: url("./blackmirror.png");
            text-indent: -9999px;
        }

        table:has(#movieMenu:hover) #favorite {
            background-image: url("./heredity.png");
            text-indent: -9999px;
        }

        table:has(#gameMenu:hover) #favorite {
            background-image: url("./splatoon.png");
            text-indent: -9999px;
        }
        
        .hobbiesStyle{
            background-color: #DBEDF1;
        }
        
        /* 선 겹쳐서 두꺼워지는 거 방지 */
        table:not(#main section:last-child){
            margin-bottom: -1px;
        }
        #main section:nth-child(2) table{
            margin-bottom: -2px;
        }

        /* photoSection */
        section:last-child #photoArea{
            height: 200px;
        }
        .photoStyle {
            background-color: lemonchiffon;
        }
        .photoBox {
            width: 30%;
            /* 나머지 10% / 6 = 1.6 */
            height: 240px;
            border: 1px solid #333;
            float: left;
            background-color: white;
            box-shadow: 8px 8px 0px #DFDFDF;
            box-sizing: border-box;
            margin: 1.6%;
        }
        .photoBox > div{
            margin: 5%;
            width: 90%;
            height: 72%;
            border: 1px solid #333;
            margin-top: 10px;
            background-size: cover;
            background-position: center;
        }
        .photoBox:first-child > div{
            background-image: url(./photo1.JPG);
            
        }
        .photoBox:nth-child(2) > div{
            background-image: url(./photo2.jpg);
        }
        .photoBox:last-child > div {
            background-image: url(./photo3.JPG);
        }



    </style>
</head>
<body>
    <div id="container">
        <nav>
            <ul>
                <a href="./page1.html">
                    <li>FOMAL</li>
                    <img src="Star border.png" alt="별모양 사진">
                </a>
                <!-- <li>
                    <a href="./page1.html">FOMAL</a>
                    <button class="starBtn btn" onclick="fnToggleStar()">별</button>
                </li> -->
                <a href="./page2.html">
                    <li>CASUAL</li>
                    <img src="Star rate.png" alt="별모양 사진">
                </a>
                <!-- <li><a href="./page2.html">CASUAL</a></li> -->
                <a href="./page3.html">
                    <li>GUESTBOOK</li>
                    <img src="Star border.png" alt="현재 페이지 표시, 별모양 사진">
                </a>
                <!-- <li><a href="./page3.html">GUESTBOOK</a></li> -->
            </ul>
        </nav>
        <div id="page">
                <!-- 여기 안에 aside랑 main 넣어야 border가 이쁘게 나올 거 같음 -->
                <h1>ABOUT ME</h1>
                <div id="main">
                    <!-- personality -->
                    <section>
                        <table>
                            <tr>
                                <th>PERSONALITY</th>
                                <td class="personalityStyle"></td>
                            </tr>
                        </table>
                        <table>
                            <tr>
                                <td class="personalityStyle2"></td>
                                <td id="personality">
                                    <p>무슨 말로 설명을 해야할지 잘 모르겠음...<br> 
                                    MBTI가 INTP이 나오긴 했음...그치만 테스트할 때마다
                                    바뀜...<mark>제법무아</mark></p>
                                </td>
                            </tr>
                        </table>
                    </section>

                     <!-- FAVORITE -->
                    <section>
                        <table>
                            <tr>
                                <th rowspan="5">FAVORITE</th> 
                            </tr>
                            <tr>
                                <td>MANGA</td>
                                <td id="mangaMenu" class="fMenu" >헌터X헌터 <span>></span></td>
                                <td id="favorite" colspan="2" rowspan="4" class="favoriteStyle">
                                    <span class="addEx">※ 왼쪽 메뉴 호버 시 이미지 표시</span>
                                </td>
                            </tr>
                            <tr>
                                <td>DRAMA</td>
                                <td id="dramaMenu" class="fMenu">블랙미러 <span>></span></td>
                            </tr>
                            <tr>
                                <td>MOVIE</td>
                                <td id="movieMenu" class="fMenu">유전 <span>></span></td>
                            </tr>
                            <tr>
                                <td>GAME</td>
                                <td id="gameMenu" class="fMenu">SPLATOON <span>></span></td>
                            </tr>
                        </table>
                    </section>

                    <!-- HOBBIES -->
                    <section>
                        <table>
                            <tr>
                                <td colspan="5" class="hobbiesStyle"></td>
                            </tr>
                            <tr>
                                <th colspan="5">
                                    HOBBIES
                                </th>
                            </tr>
                            <tr>
                                <td>게임하기</td>
                                <td>유튜브보기</td>
                                <td>그림그리기</td>
                                <td>스터디하기</td>
                                <td>풍경사진찍기</td>
                            </tr>
                        </table>
                    </section>

                    <!-- PHOTOS -->
                    <section>
                        <table>
                            <tr>
                                <td class="photoStyle"></td>
                                <th style="width: 340px">찍은 풍경사진들</th>
                            </tr>
                            <tr id="photoArea">
                                <td colspan="2">
                                    <div class="photoBox">
                                        <div></div>
                                    </div>
                                    <div class="photoBox">
                                        <div></div>
                                    </div>
                                    <div class="photoBox">
                                        <div></div>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </section>
                </div>
            <!-- <div id="main">
                
                
            </div> -->
        </div>
    </div>
    
</body>
</html>
