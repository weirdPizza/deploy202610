<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input태그!</title>
</head>
<body>
    <!-- 영역을 잡는 fieldset, 영역의 타이틀 legend -->
    <fieldset>
        <legend>회원가입</legend>
        <div>
            <!-- input 태그의 기본 type은 text (생략 가능) -->
            <label>아이디 : <input type="text" autofocus placeholder="아이디를 입력해주세요."></label>
            <input type="button" value="중복체크">
        </div>
        <div>
            <label>비밀번호 : <input type="password" placeholder="비밀번호를 입력해주세요."></label>
        </div>
        <div>
            <!-- 골뱅이와 점 없으면 이메일 형식 아니라 알려줌. 근데 한계가 있어서 input email은 잘 안쓰긴 해. -->
            <!-- 나중에 정규식으로 대체하게 될 운명 -->
            <label>이메일 : <input type="email"></label>
            <!-- 나이를 입력할 때 input number 써도 돼? ㄴㄴ number는 소수점의 점 허용, 지수의 e 허용해서 안 씀. 정규식으로 대체함. -->
        </div>
        <div>
            <!-- name으로 묶어야 그룹 가능 -->
            성별 :
            <label><input type="radio" name="gender" checked>남자</label>
            <label><input type="radio" name="gender">여자</label>
        </div>
        <div>
            <!-- 얘는 하나만 선택해야 하는 것도 아니고 name 왜 묶음? -->
             <!-- 백엔드에서 처리할 때 편하라고 ㅇㅇ -->
            취미 : 
            <label><input type="checkbox" name="habit" checked>코딩</label>
            <label><input type="checkbox" name="habit">게임</label>
            <label><input type="checkbox" name="habit">독서</label>
            <label><input type="checkbox" name="habit">그림그리기</label>
            <label><input type="checkbox" name="habit">영화감상</label>
        </div>
        <div>
            <!-- multiple 여러 개 파일 선택 한 번에 가능, aceept도 여러 유형으로 지정 가능 -->
            프로필 이미지 : 
            <input type="file" accept=".jpg" multiple>
        </div>

        <div>
            나이대 :
            <select>
                <option>:: 선택 ::</option>
                <option>10대</option>
                <option>20대</option>
                <option>30대</option>
                <option>40대</option>
                <option>50대</option>
                <option>60대 이상</option>
            </select>
        </div>

        <div>
            자기소개 : 
            <div>
                <textarea cols="50" rows="8" placeholder="자기소개를 입력하세요."></textarea>
            </div>
        </div>

        <div>
            <!-- submit과 reset은 나중에 form태그와 연계해서 사용(jsp) -->
            <!-- input버튼과 button태그 큰 차이 없음(=사소한 차이는 있다)  -->
            <input type="submit">
            <input type="button" value="회원가입">
            <button>회원가입</button>
            <input type="reset">
        </div>
    </fieldset>
</body>
</html>
